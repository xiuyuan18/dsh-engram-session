# dsh-engram-session bundle layer. Applied when this package is listed in the
# profile's dsh.profile.bundles (dsh plugin --profile web add
# /home/xiuyuaned/dsh-plugins/dsh-engram-session does that).
#
# The bundle owns the plugin row only. The Engram Memory Protocol is NOT a
# persona override: the plugin registers it as its own system-prompt section
# (`engram:memory-protocol`, order 10, text in protocol.js) at load, so the
# deployment persona stays fully user-owned, other system-prompt patchers
# cannot drop the protocol by replacing the row, and removing the bundle
# unregisters tools and protocol together.
- insert:
    - id: engram-session
      name: 'dsh-engram-session'
      config:
        serverName: engram
        # `binary` is deliberately NOT pinned here: the plugin auto-detects
        # the Engram executable (PATH, then ~/.local/bin, /usr/local/bin,
        # /opt/homebrew/bin). Pin it in the profile config only for exotic
        # installs (e.g. config.binary: /custom/path/engram).
        args:
          - mcp
